<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — My PWA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 48px 32px;
      max-width: 400px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #7c3aed;
    }
    p {
      font-size: 16px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .hint {
      font-size: 13px;
      color: #999;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #e5e5e5; }
      p { color: #999; }
      .hint { color: #666; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x1F310;</div>
    <h1>You are offline</h1>
    <p>This page hasn't been cached yet. Visit it while online to make it available offline.</p>
    <p class="hint">Pages you've already visited will work without internet.</p>
  </div>
</body>
</html>
